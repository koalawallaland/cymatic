<p>Are you a violet<br>
Or a daisy</p>
<p>Pots and pans<br>
I’m feeling hazy</p>
<p>Deeply nuanced<br>
Or just lazy</p>
<p>Am i slowly going crazy</p>
<p>In my dreams<br>
My shadows<br>
Pay me 📕</p>
