<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe1ff">
<meta name="description" content="Cloud Visualizer, an interactive cloud studio within Cymatic.">
<title>Cloud Visualizer ✧ Cymatic Studio</title>
<style>
:root{color-scheme:light;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#74518d}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{display:flex;flex-direction:column;background:#f6e4f8}
header{z-index:2;min-height:54px;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px clamp(12px,3vw,24px);padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(92deg,#fff1fc 0%,#f1dafa 49%,#ddd5ff);border-bottom:1px solid #dab6e8;box-shadow:0 2px 20px #b88adb29}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand strong{font-weight:900;letter-spacing:.03em;font-size:clamp(13px,2.7vw,19px);white-space:nowrap;text-shadow:0 0 10px #ffcaf7}.brand small{display:block;font-size:10px;letter-spacing:.13em;color:#9b6ab6;text-transform:uppercase}
nav{display:flex;align-items:center;gap:8px}
a{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;border-radius:999px;border:1px solid #ddbbe8;color:#724c9a;text-decoration:none;background:#fff9ffbd;white-space:nowrap;font-size:12px;font-weight:800}
a:focus-visible{outline:3px solid #9d73d3;outline-offset:2px}
a.primary{background:linear-gradient(120deg,#f5b7eb,#d2b5fd);color:#553b79;border-color:#d5a0e4}
main{position:relative;flex:1;min-height:0;background:linear-gradient(135deg,#ffe5f3,#dce6ff)}
iframe{position:absolute;display:block;inset:0;width:100%;height:100%;border:none;background:transparent}
.note{position:absolute;bottom:10px;left:12px;right:12px;z-index:0;pointer-events:none;text-align:center;font-size:11px;color:#9a75b5}
@media(max-width:580px){header{gap:7px;padding-left:9px;padding-right:9px}.brand{gap:5px}.brand strong{font-size:14px}.brand small{font-size:9px}.link-label{display:none}nav{gap:5px}a{padding:8px 9px;font-size:12px}}
</style>
</head>
<body>
<header>
 <div class="brand"><span aria-hidden="true">☁️</span><div><small>Cymatic Studio</small><strong>Cloud Visualizer ✧</strong></div></div>
 <nav aria-label="Visualizer navigation">
 <a href="../home.html" aria-label="Back to desk">↜ <span class="link-label">&nbsp;Desk</span></a>

 </nav>
</header>
<main>
 <div class="note" id="fallback">If the visualizer doesn't appear, use ↗ Full page above.</div>
 <iframe title="Original interactive Cloud Visualizer" src="https://cymatic-cloud-sketch-drop-shop.meshedcoconut.chatgpt.site/" referrerpolicy="no-referrer" allowfullscreen loading="eager"></iframe>
</main>
</body>
</html>
