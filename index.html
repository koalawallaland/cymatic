<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koala Walla Land</title>
<meta name="description" content="Koala Walla Land is coming soon: keycaps, resin, sound and whatever's on the bench.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Modak&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #12061d;
    --ink: #fff5fb;
    --muted: #b7a6c9;
    --pink: #ff4fa8;
    --cyan: #22e6ff;
    --lime: #d8ff3e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Zen Maru Gothic", ui-rounded, system-ui, sans-serif;
    display: grid; place-items: center; text-align: center;
    padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background-image:
      radial-gradient(60% 45% at 50% 38%, rgba(255, 79, 168, .18), transparent 70%),
      radial-gradient(40% 35% at 80% 80%, rgba(34, 230, 255, .08), transparent 70%);
  }
  main { display: grid; gap: 18px; justify-items: center; max-width: 34rem; }
  .sign {
    margin: 0; padding: 10px 22px 12px; border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, .14); background: rgba(10, 4, 20, .5);
    font: 900 clamp(30px, 9vw, 52px)/1 "Zen Maru Gothic", sans-serif; color: #fff; white-space: nowrap;
    text-shadow: 0 0 3px #fff, 0 0 10px var(--pink), 0 0 22px var(--pink), 0 0 44px var(--pink);
    box-shadow: 0 0 30px rgba(255, 79, 168, .3);
    animation: hum 7s infinite;
  }
  @keyframes hum { 0%, 91%, 100% { opacity: 1; } 92% { opacity: .5; } 93% { opacity: 1; } 95% { opacity: .7; } 96% { opacity: 1; } }
  h1 {
    margin: 0; font: 400 clamp(40px, 12vw, 76px)/.95 "Modak", "Arial Rounded MT Bold", sans-serif; text-wrap: balance;
    background: linear-gradient(100deg, #fff 0%, #ffb6e4 22%, #d7f7ff 40%, #fff 52%, #b6a4ff 70%, #e8ffb0 88%, #fff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .soon {
    display: inline-flex; align-items: center; gap: 10px; margin: 0;
    font-weight: 900; letter-spacing: .24em; text-transform: uppercase; font-size: 14px; color: var(--lime);
    text-shadow: 0 0 8px rgba(216, 255, 62, .5);
  }
  .soon .tube { letter-spacing: .08em; color: var(--cyan); text-shadow: 0 0 8px rgba(34, 230, 255, .6); }
  p.line { margin: 0; color: var(--muted); max-width: 28ch; }
  @media (prefers-reduced-motion: reduce) { .sign { animation: none; } }
</style>
</head>
<body>
<main>
  <p class="sign" aria-hidden="true">(っ˘ω˘ς)</p>
  <h1>Koala Walla Land</h1>
  <p class="soon"><span class="tube" lang="zh-Hant">即將</span> coming soon <span class="tube" lang="zh-Hant">開幕</span></p>
  <p class="line">Keycaps, resin, sound and whatever's on the bench. The doors open soon.</p>
</main>
</body>
</html>
