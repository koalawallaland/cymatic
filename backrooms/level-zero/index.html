<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>the backrooms</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Courier New", ui-monospace, monospace;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  /* crosshair */
  #crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 4px;
    height: 4px;
    margin: -2px 0 0 -2px;
    border-radius: 50%;
    background: rgba(255, 250, 220, 0.7);
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
    pointer-events: none;
    display: none;
  }

  /* start / pause overlay */
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: rgba(0, 0, 0, 0.82);
    color: #d8c98a;
    cursor: pointer;
    user-select: none;
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: 14px;
    font-weight: 400;
    color: #e6d695;
    text-shadow: 0 0 18px rgba(214, 190, 90, 0.35);
  }
  #overlay .sub {
    margin: 0;
    font-size: 13px;
    letter-spacing: 4px;
    color: #9a8d5e;
  }
  #overlay .prompt {
    margin-top: 14px;
    font-size: 16px;
    letter-spacing: 3px;
    color: #efe3b0;
    animation: pulse 1.6s ease-in-out infinite;
  }
  #overlay .controls {
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #7d734c;
    text-align: center;
    line-height: 1.9;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="crosshair"></div>
  <div id="overlay">
    <h1>THE BACKROOMS</h1>
    <p class="sub">LEVEL 0 &mdash; NOCLIP</p>
    <p class="prompt" id="overlay-prompt">CLICK TO ENTER</p>
    <p class="controls">
      WASD &mdash; move &nbsp;&middot;&nbsp; SHIFT &mdash; run &nbsp;&middot;&nbsp; MOUSE &mdash; look<br />
      M &mdash; mute &nbsp;&middot;&nbsp; ESC &mdash; release cursor
    </p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>

</html>
