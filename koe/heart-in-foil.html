<body><main><a href="./">← KOE</a><div class="art" aria-hidden="true"><span class="foil">🩶</span></div><div class="meta">ORIGINAL AUDIO · 0:31</div><h1>Heart in Foil</h1><p>I'll wrap my heart in foil. And I'll keep it in the freezer.</p><button id="play" type="button">▶ Play Heart in Foil</button><progress id="progress" value="0" max="30.772"></progress><output id="status" role="status">Ready to listen</output><footer>A one-button listening experience. No Stylophone score, no setup, no file picker.</footer><audio id="audio" preload="metadata" src="heart-in-foil.mp3"></audio></main>
