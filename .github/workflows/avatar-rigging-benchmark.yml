name: Avatar rigging pipeline smoke tests
on:
  push:
    branches:
      - experiment/rigging-method-benchmark
    paths:
      - 'benchmarks/avatar-rigging/**'
      - '.github/workflows/avatar-rigging-benchmark.yml'
  pull_request:
    paths:
      - 'benchmarks/avatar-rigging/**'
      - '.github/workflows/avatar-rigging-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.method }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        method: [mesh, still, psd, kit, cubism]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: astral-sh/setup-uv@v5
      - name: Run isolated method test (no uploads, no deployment)
        run: bash benchmarks/avatar-rigging/run.sh "${{ matrix.method }}"
      - name: Record method name
        if: always()
        run: |
          echo "Method: ${{ matrix.method }}" >> "$GITHUB_STEP_SUMMARY"
