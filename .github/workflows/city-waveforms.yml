name: Refresh city seismic spectra
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: city-waveform-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/waveform-requirements.txt
      - run: pip install -r tools/waveform-requirements.txt
      - run: python tools/collect_city_waveforms.py
      - name: Publish current measurements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/city-waveforms.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh city seismic spectra"
            git push
          fi
